services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: novasocial
      MONGO_INITDB_ROOT_PASSWORD: novasocial
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--username", "novasocial", "--password", "novasocial", "--authenticationDatabase", "admin", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novasocial
      POSTGRES_PASSWORD: novasocial
      POSTGRES_DB: novasocial
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novasocial -d novasocial"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ./backend
    env_file:
      - .env.example
    environment:
      DATABASE_PROVIDER: mongodb
      MONGODB_URI: mongodb://novasocial:novasocial@mongodb:27017/novasocial?authSource=admin
      MONGODB_DATABASE: novasocial
      DATABASE_URL: postgresql://novasocial:novasocial@postgres:5432/novasocial
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: novasocial-media
      API_PUBLIC_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  admin:
    build:
      context: ./admin
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongodb-data:
  postgres-data:
  redis-data:
  minio-data:
